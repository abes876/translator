<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voice Translator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:#060b14;color:#e0e4ea;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.header{text-align:center;padding:max(env(safe-area-inset-top),24px) 20px 6px}
.header .sub{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#4a5568;font-weight:600}
.header h1{font-size:24px;font-weight:700;margin:4px 0 0;background:linear-gradient(135deg,#7eb8f7,#2dd4bf,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.target-picker{display:flex;align-items:center;gap:8px;margin:12px 20px 2px;padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.035)}
.target-picker label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#5a6a80;font-weight:700;white-space:nowrap}
.target-picker select{min-width:0;flex:1;background:#0b1220;border:1px solid rgba(255,255,255,.09);border-radius:10px;color:#e5e7eb;padding:8px 9px;font-size:13px;outline:none}
.status-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 20px;font-size:12px;color:#5a6a80;min-height:32px;text-align:center}
.status-dot{width:7px;height:7px;border-radius:50%;background:#2d3748;transition:all .3s;flex:0 0 auto}
.status-dot.active{background:rgb(var(--active-rgb));box-shadow:0 0 8px rgba(var(--active-rgb),.65)}
.btn-wrap{display:flex;justify-content:center;gap:20px;padding:12px 20px 8px}
.lang-btn{width:120px;height:120px;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border:2px solid rgba(255,255,255,.08);cursor:pointer;position:relative;outline:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .3s cubic-bezier(.4,0,.2,1)}
.lang-btn .flag{font-size:32px;line-height:1}
.lang-btn .label{font-size:11px;font-weight:600;color:#6b7280;letter-spacing:1px;text-transform:uppercase;max-width:86px;line-height:1.2}
.lang-btn.active{border-color:rgba(var(--active-rgb),.6);box-shadow:0 0 40px rgba(var(--active-rgb),.2);animation:breathe 2s ease-in-out infinite}
.lang-btn.active .label{color:rgb(var(--active-rgb))}
.stop-btn{width:80px;height:80px;border-color:rgba(239,68,68,.4)}
.stop-btn .flag{font-size:24px}
.stop-btn .label{color:#ef4444}
.wave{display:flex;align-items:center;justify-content:center;gap:2.5px;height:34px;margin:6px 20px}
.wave .b{width:3px;border-radius:2px;background:#2d3748;transition:height .07s linear;height:3px}
.text-panel{margin:0 20px 8px;display:grid;gap:8px}
.text-panel textarea{width:100%;min-height:68px;resize:none;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#e5e7eb;padding:10px 12px;font:15px/1.4 -apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;outline:none;user-select:text;-webkit-user-select:text}
.text-panel textarea:focus{border-color:rgba(45,212,191,.35);box-shadow:0 0 0 3px rgba(45,212,191,.08)}
.text-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.text-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;font-size:12px;color:#cbd5e1;cursor:pointer;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.text-btn:active{transform:translateY(1px)}
.cards{flex:1;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;padding-bottom:max(env(safe-area-inset-bottom),20px)}
.card{border-radius:16px;padding:12px 16px;animation:fadeIn .3s ease}
.card.orig{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.card.tr{background:rgba(var(--card-rgb),.14);border:1px solid rgba(var(--card-rgb),.32)}
.card .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#5a6a80;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card .lbl .right{margin-left:auto}
.card .txt{font-size:15px;line-height:1.5;color:#c8d0dc;transition:font-size .2s;user-select:text;-webkit-user-select:text}
.card.tr .txt{font-size:17px;font-weight:500;color:#f3f4f6}
body.sz-lg .card .txt{font-size:20px}
body.sz-lg .card.tr .txt{font-size:24px}
body.sz-xl .card .txt{font-size:26px}
body.sz-xl .card.tr .txt{font-size:32px}
.toolbar{display:flex;justify-content:center;gap:8px;padding:0 20px 4px}
.tbtn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:5px 14px;font-size:11px;color:#6b7280;cursor:pointer;outline:none;transition:all .2s}
.tbtn.on{background:rgba(45,212,191,.15);border-color:rgba(45,212,191,.35);color:#5eead4}
.rbtn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:3px 10px;font-size:11px;color:#9ca3af;cursor:pointer;outline:none}
.shimmer{font-size:14px;background:linear-gradient(90deg,#4a5568,#9ca3af,#4a5568);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 1.5s infinite}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:.42;padding:30px 0}
.empty .big{font-size:44px}
.empty p{font-size:13px;color:#6b7280;text-align:center;line-height:1.7}
.err{margin:0 20px;padding:10px 14px;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);border-radius:12px;font-size:12px;color:#fca5a5;animation:fadeIn .3s;display:none}
.footer{padding:8px 20px 20px;text-align:center;font-size:10px;color:#1e293b}
.sep{border:none;border-top:1px solid rgba(255,255,255,.03);margin:2px 0}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
</head>
<body>
<div class="header">
  <div class="sub">Real-Time</div>
  <h1>Voice Translator</h1>
</div>
<div class="target-picker">
  <label for="targetLang">English ↔</label>
  <select id="targetLang" onchange="setTargetLang(this.value)">
    <option value="es">Spanish · Español</option>
    <option value="zhTW">Mandarin Chinese (Taiwan) · 繁體中文</option>
    <option value="nanTW">Taiwanese Hokkien · 台語</option>
    <option value="hakTW">Taiwan Hakka · 客語</option>
    <option value="ja">Japanese · 日本語</option>
  </select>
</div>
<div class="status-bar">
  <div class="status-dot" id="dot"></div>
  <span id="stxt">Tap a language to speak</span>
</div>
<div class="btn-wrap">
  <button class="lang-btn" id="btnEn" onclick="toggleLang('en')">
    <span class="flag">🇺🇸</span>
    <span class="label">English</span>
  </button>
  <button class="lang-btn stop-btn" id="btnStop" onclick="stopListening()" style="display:none">
    <span class="flag">⏹</span>
    <span class="label">Stop</span>
  </button>
  <button class="lang-btn" id="btnTarget" onclick="toggleLang(targetLang)">
    <span class="flag" id="targetFlag">🇪🇸</span>
    <span class="label" id="targetLabel">Español</span>
  </button>
</div>
<div class="wave" id="wave"></div>
<div class="text-panel">
  <textarea id="typedText" placeholder="Type text"></textarea>
  <div class="text-actions">
    <button class="text-btn" id="typeFromEn" onclick="translateTyped('en')">English → Español</button>
    <button class="text-btn" id="typeFromTarget" onclick="translateTyped(targetLang)">Español → English</button>
  </div>
</div>
<div class="toolbar">
  <button class="tbtn on" id="szSm" onclick="setSize('sm')">A</button>
  <button class="tbtn" id="szLg" onclick="setSize('lg')">A+</button>
  <button class="tbtn" id="szXl" onclick="setSize('xl')">A++</button>
</div>
<div class="err" id="err"></div>
<div class="cards" id="cards">
  <div class="empty"><div class="big">🎙</div><p id="emptyText">Tap 🇺🇸 to speak English<br>Tap 🇪🇸 to speak Spanish<br>Translation is automatic.</p></div>
</div>
<div class="footer">Tap language · Speak · Hear translation · Powered by Claude<br><button id="dbgToggle" onclick="toggleDbg()" style="margin-top:4px;background:none;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:3px 10px;font-size:10px;color:#3a4558;cursor:pointer">Show Logs</button></div>

<script>
const L={
  en:{code:'en-US',speakCode:'en-US',label:'English',short:'English',prompt:'English',flag:'🇺🇸',accent:'96,165,250',voicePrefs:['Karen','Samantha','Moira','Tessa','Google UK English Female','Shelley (English (United States))','Sandy (English (United States))'],voiceLangs:['en']},
  es:{code:'es-ES',speakCode:'es-ES',label:'Español',short:'Spanish',prompt:'Spanish',flag:'🇪🇸',accent:'248,113,113',voicePrefs:['Google español','Google español de Estados Unidos','Reed (Spanish (Mexico))','Reed (Spanish (Spain))','Rocko (Spanish (Mexico))','Rocko (Spanish (Spain))'],voiceLangs:['es']},
  zhTW:{code:'zh-TW',speakCode:'zh-TW',label:'繁體中文',short:'Mandarin Chinese (Taiwan)',prompt:'Mandarin Chinese as used in Taiwan, written in Traditional Chinese',flag:'🇹🇼',accent:'45,212,191',voicePrefs:['Meijia','Ting-Ting','Sin-ji','Google 國語'],voiceLangs:['zh-TW','zh']},
  nanTW:{code:'nan-TW',speakCode:'zh-TW',label:'台語',short:'Taiwanese Hokkien',prompt:'Taiwanese Hokkien (Taigi). Use natural Taiwanese Hokkien, not Mandarin Chinese. Prefer Tailo romanization with common Traditional Han characters when helpful',flag:'台',accent:'251,191,36',voicePrefs:['Meijia','Ting-Ting','Sin-ji','Google 國語'],voiceLangs:['nan','zh-TW','zh']},
  hakTW:{code:'hak-TW',speakCode:'zh-TW',label:'客語',short:'Taiwan Hakka',prompt:'Taiwan Hakka. Use natural Taiwan Hakka, not Mandarin Chinese. Include common Hakka romanization with Traditional Han characters when helpful',flag:'客',accent:'167,139,250',voicePrefs:['Meijia','Ting-Ting','Sin-ji','Google 國語'],voiceLangs:['hak','zh-TW','zh']},
  ja:{code:'ja-JP',speakCode:'ja-JP',label:'日本語',short:'Japanese',prompt:'Japanese',flag:'🇯🇵',accent:'244,114,182',voicePrefs:['Kyoko','Otoya','Hattori','Google 日本語'],voiceLangs:['ja']}
};
const targetIds=['es','zhTW','nanTW','hakTW','ja'];
var targetLang='es';
let activeLang=null,rec=null,hist=[],bars=[],apiKey=new URLSearchParams(location.search).get('key')||'',speaking=false,translating=false;
let silenceTimer=null,pendingText='';
const SILENCE_FINAL=600;
const SILENCE_INTERIM=1800;
const MODEL_FAST='claude-haiku-4-5-20251001';
const MODEL_FALLBACK='claude-sonnet-4-20250514';
let model=MODEL_FAST;
const $=id=>document.getElementById(id);

for(let i=0;i<28;i++){const b=document.createElement('div');b.className='b';$('wave').appendChild(b);bars.push(b)}
let wInt;
function rgb(lang){return (L[lang]||L.en).accent}
function animW(a,lang){
  clearInterval(wInt);
  if(!a){bars.forEach(b=>{b.style.height='3px';b.style.background='#2d3748'});return}
  const color='rgb('+rgb(lang)+')';
  wInt=setInterval(()=>{bars.forEach((b,i)=>{const r=Math.abs(i-14)/14;b.style.height=((1-r)*24+3)*(.25+Math.random()*.75)+'px';b.style.background=color})},80);
}

function setS(t,lang){
  const dot=$('dot');
  dot.className='status-dot'+(lang?' active':'');
  if(lang)dot.style.setProperty('--active-rgb',rgb(lang));
  $('stxt').textContent=t;
}
function err(m){const e=$('err');e.style.display=m?'block':'none';e.textContent=m?'⚠ '+m:''}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function target(){return L[targetLang]}
function pairLabel(){return 'English ↔ '+target().short}

function ensureApiKey(){
  if(apiKey)return true;
  const k=prompt('Paste your Anthropic API key:');
  if(!k||!k.trim())return false;
  apiKey=k.trim();
  return true;
}

function setTargetLang(lang){
  if(!targetIds.includes(lang))return;
  if(activeLang&&activeLang!=='en')stopListening();
  targetLang=lang;
  const t=target();
  $('targetFlag').textContent=t.flag;
  $('targetLabel').textContent=t.label;
  $('typeFromEn').textContent='English → '+t.label;
  $('typeFromTarget').textContent=t.label+' → English';
  $('targetLang').value=lang;
  if(!activeLang)setS(pairLabel(),'');
  render();
}

function pickVoice(lang){
  const cfg=L[lang];
  const voices=speechSynthesis.getVoices();
  let pick=null;
  for(const p of cfg.voicePrefs||[]){pick=voices.find(v=>v.name.includes(p));if(pick)break}
  if(!pick){
    for(const prefix of cfg.voiceLangs||[]){
      pick=voices.find(v=>v.lang.toLowerCase().startsWith(prefix.toLowerCase()));
      if(pick)break;
    }
  }
  return pick;
}

function speak(text,lang){
  if(!text||!speechSynthesis)return;
  speechSynthesis.cancel();
  const cfg=L[lang];
  const u=new SpeechSynthesisUtterance(text);
  u.lang=cfg.speakCode||cfg.code;
  u.rate=.95;
  u.pitch=1.0;
  const pick=pickVoice(lang);
  if(pick){u.voice=pick;dbg('Voice: '+pick.name)}
  else{dbg('Voice: default for '+cfg.short)}
  speechSynthesis.speak(u);
}

async function translate(text,from){
  if(!text.trim()||translating)return;
  if(!ensureApiKey())return;
  translating=true;
  const activeTarget=targetLang;
  const to=from==='en'?activeTarget:'en';
  const fromCfg=L[from],toCfg=L[to];
  const tc=document.createElement('div');
  tc.className='card orig';tc.id='tempCard';
  tc.innerHTML='<div class="lbl">🎤 '+fromCfg.flag+' '+fromCfg.short+'</div><div class="txt">'+esc(text)+'</div><div style="margin-top:8px"><span class="shimmer">Translating…</span></div>';
  $('cards').insertBefore(tc,$('cards').firstChild);
  setS('Translating…',from);

  try{
    let usedModel=model,raw='';
    const sysPrompt=[
      'Translate the following '+fromCfg.prompt+' text to '+toCfg.prompt+'.',
      'Reply only with the translation, with no labels, commentary, quotes, or Markdown.',
      'Be natural and preserve tone.',
      'For Taiwanese Hokkien or Taiwan Hakka output, do not substitute Mandarin Chinese.'
    ].join(' ');
    for(let attempt=0;attempt<3;attempt++){
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:usedModel,max_tokens:220,stream:true,
          system:sysPrompt,
          messages:[{role:'user',content:text}]})
      });
      dbg('API ['+usedModel+'] status='+res.status+' attempt='+(attempt+1));
      if(res.status===404&&usedModel===MODEL_FAST){
        dbg('Haiku unavailable, falling back to Sonnet');
        usedModel=MODEL_FALLBACK;model=MODEL_FALLBACK;continue;
      }
      if(res.status===529||res.status===429){
        const wait=(attempt+1)*1000;
        dbg('Overloaded, retry in '+wait+'ms');
        setS('API busy…',from);
        await new Promise(r=>setTimeout(r,wait));
        continue;
      }
      if(!res.ok){const e=await res.json();throw new Error(e.error?.message||JSON.stringify(e))}
      raw='';
      const reader=res.body.getReader();
      const decoder=new TextDecoder();
      let buf='';
      while(true){
        const{done,value}=await reader.read();
        if(done)break;
        buf+=decoder.decode(value,{stream:true});
        const lines=buf.split('\n');
        buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith('data: '))continue;
          const d=line.slice(6);
          if(d==='[DONE]')break;
          try{
            const ev=JSON.parse(d);
            if(ev.type==='content_block_delta'&&ev.delta?.text)raw+=ev.delta.text;
          }catch(e){}
        }
      }
      break;
    }
    raw=raw.replace(/```json|```|^"|"$/g,'').trim();
    dbg('Translation: '+raw.substring(0,100));
    if(!raw)throw new Error('Empty response');

    const temp=document.getElementById('tempCard');if(temp)temp.remove();
    const translation=raw;
    animW(true,to);
    setS(fromCfg.short+' → '+toCfg.short,to);

    hist.unshift({from,orig:text,trans:translation,to,t:Date.now()});
    if(hist.length>15)hist.pop();
    render();

    speaking=true;translating=false;
    if(rec){try{rec.abort()}catch(e){}}
    speechSynthesis.cancel();
    dbg('Speaking '+toCfg.short+'…');
    setS('Speaking…',to);
    animW(false);
    speak(translation,to);
    await new Promise(resolve=>{
      const check=setInterval(()=>{if(!speechSynthesis.speaking){clearInterval(check);resolve()}},50);
      setTimeout(()=>{clearInterval(check);resolve()},10000);
    });
    await new Promise(r=>setTimeout(r,200));
    speaking=false;
    dbg('Speech done, resuming mic if active');
    if(activeLang){setS('Listening for '+L[activeLang].short+'…',activeLang);animW(true,activeLang);startR()}
  }catch(e){
    console.error(e);
    dbg('TRANSLATE ERROR: '+e.message);
    err('Translation failed: '+e.message);setTimeout(()=>err(''),5000);
    const t=document.getElementById('tempCard');if(t)t.remove();
    translating=false;
    if(activeLang&&!speaking){setS('Listening for '+L[activeLang].short+'…',activeLang);animW(true,activeLang);startR()}
  }
}

function translateTyped(from){
  err('');
  const text=$('typedText').value.trim();
  if(!text)return;
  translate(text,from);
}

function render(){
  const c=$('cards');c.innerHTML='';
  if(!hist.length){
    const t=target();
    c.innerHTML='<div class="empty"><div class="big">🎙</div><p id="emptyText">Tap 🇺🇸 to speak English<br>Tap '+esc(t.flag)+' to speak '+esc(t.short)+'<br>Translation is automatic.</p></div>';
    return;
  }
  hist.forEach((h,i)=>{
    const d=document.createElement('div');
    d.style.cssText='display:flex;flex-direction:column;gap:6px;animation:fadeIn .3s ease';
    d.innerHTML=`
      <div class="card orig"><div class="lbl"><span>${L[h.from].flag}</span> ${esc(L[h.from].short)}</div><div class="txt">${esc(h.orig)}</div></div>
      <div class="card tr" style="--card-rgb:${rgb(h.to)}"><div class="lbl"><span>${L[h.to].flag}</span> ${esc(L[h.to].short)}<span class="right"><button class="rbtn" data-idx="${i}">🔊 Replay</button></span></div><div class="txt">${esc(h.trans)}</div></div>
    `;
    d.querySelector('.rbtn').onclick=()=>speak(h.trans,h.to);
    c.appendChild(d);
    if(i<hist.length-1){const s=document.createElement('hr');s.className='sep';c.appendChild(s)}
  });
}

let dbgLog=[],dbgVisible=false;
function dbg(msg){
  dbgLog.push(msg);
  const d=document.getElementById('dbg');
  if(d){d.innerHTML=msg+'<br>'+d.innerHTML;if(d.children.length>30)d.lastChild.remove()}
}
function toggleDbg(){
  dbgVisible=!dbgVisible;
  let d=document.getElementById('dbg');
  let cp=document.getElementById('copyBtn');
  if(!d){
    d=document.createElement('div');d.id='dbg';d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#111;color:#0f0;font-size:10px;font-family:monospace;padding:6px 10px;max-height:120px;overflow-y:auto;z-index:999;opacity:0.85;display:none';
    d.innerHTML=dbgLog.slice(-30).reverse().map(m=>'<div>'+m+'</div>').join('');
    cp=document.createElement('button');cp.id='copyBtn';cp.textContent='COPY';cp.style.cssText='position:fixed;bottom:122px;right:10px;z-index:1000;background:#f59e0b;color:#000;border:none;padding:6px 12px;border-radius:8px;font-weight:bold;font-size:12px;display:none';
    cp.onclick=()=>{navigator.clipboard.writeText(dbgLog.join('\n')).then(()=>{cp.textContent='COPIED!';setTimeout(()=>cp.textContent='COPY',1500)}).catch(()=>{const ta=document.createElement('textarea');ta.value=dbgLog.join('\n');document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();cp.textContent='COPIED!';setTimeout(()=>cp.textContent='COPY',1500)})};
    const cl=document.createElement('button');cl.textContent='✕';cl.style.cssText='position:fixed;bottom:122px;left:10px;z-index:1000;background:#ef4444;color:#fff;border:none;width:28px;height:28px;border-radius:50%;font-size:14px;font-weight:bold;cursor:pointer';
    cl.onclick=toggleDbg;
    document.body.appendChild(cl);cl.id='closeBtn';
    document.body.appendChild(cp);document.body.appendChild(d);
  }
  d.style.display=dbgVisible?'block':'none';
  cp.style.display=dbgVisible?'block':'none';
  const cl=document.getElementById('closeBtn');if(cl)cl.style.display=dbgVisible?'block':'none';
  $('dbgToggle').textContent=dbgVisible?'Hide Logs':'Show Logs';
}

function startR(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){err('Speech Recognition not supported.');dbg('ERROR: No SpeechRecognition API');return}
  if(rec){try{rec.abort()}catch(e){}}

  const lang=activeLang;
  const r=new SR();
  r.lang=L[lang].code;
  r.interimResults=true;
  r.continuous=true;
  r.maxAlternatives=1;
  dbg('Listening '+L[lang].short+' with '+L[lang].code);

  r.onspeechstart=()=>{dbg('Speech detected')};
  r.onspeechend=()=>{dbg('Speech ended')};

  let processedIdx=0;

  r.onresult=e=>{
    if(speaking)return;
    clearTimeout(silenceTimer);
    let fin='',interim='';
    for(let i=processedIdx;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      const c=e.results[i][0].confidence;
      if(e.results[i].isFinal){
        fin+=t;
        processedIdx=i+1;
        dbg('FINAL: "'+t+'" conf='+c.toFixed(2));
      } else {
        interim+=t;
        dbg('INTERIM: "'+t+'"');
      }
    }
    pendingText=(pendingText+' '+fin).trim();
    const display=(pendingText+' '+interim).trim();
    if(display){
      let lc=document.getElementById('liveCard');
      if(!lc){lc=document.createElement('div');lc.id='liveCard';lc.className='card orig';lc.innerHTML='<div class="lbl">🎤 Listening…</div><div class="txt" id="liveTxt"></div>';$('cards').insertBefore(lc,$('cards').firstChild)}
      document.getElementById('liveTxt').textContent=display;
    }
    const hasFinal=!!pendingText.trim();
    const delay=hasFinal?SILENCE_FINAL:SILENCE_INTERIM;
    const curInterim=interim;
    const textToCheck=pendingText||curInterim;
    if(textToCheck.trim()){
      silenceTimer=setTimeout(()=>{
        if(speaking||translating)return;
        let text=pendingText.trim();
        if(!text){text=curInterim.trim();processedIdx=e.results.length}
        if(text){
          dbg('Silence '+delay+'ms → translate: "'+text+'"');
          pendingText='';
          const lc=document.getElementById('liveCard');if(lc)lc.remove();
          translate(text,lang);
        }
      },delay);
    }
  };

  r.onerror=e=>{
    if(e.error==='not-allowed'){
      dbg('ERROR: mic denied');
      err('Microphone denied. Check browser permissions.');
      stopListening();
    } else if(e.error==='language-not-supported'){
      dbg('ERROR: language not supported '+L[lang].code);
      err('Voice input is not supported for '+L[lang].short+' in this browser. Use typed text.');
      stopListening();
    } else if(e.error==='no-speech'||e.error==='aborted'){
      // silent - expected during normal operation
    } else {
      dbg('ERROR: '+e.error);
      err('Speech error: '+e.error);setTimeout(()=>err(''),3000);
    }
  };

  r.onend=()=>{
    if(activeLang&&!speaking){
      if(pendingText.trim()){
        const text=pendingText.trim();pendingText='';
        const lc=document.getElementById('liveCard');if(lc)lc.remove();
        dbg('Translating pending: "'+text+'"');
        translate(text,lang);
      }
      setTimeout(()=>{if(activeLang&&!speaking)startR()},80);
    }
  };
  rec=r;
  try{r.start()}catch(e){dbg('START ERROR: '+e.message);err('Mic error: '+e.message)}
}

function stopListening(){
  activeLang=null;
  translating=false;pendingText='';clearTimeout(silenceTimer);
  speechSynthesis.cancel();speaking=false;
  if(rec){try{rec.abort()}catch(e){}}
  rec=null;
  const lc=document.getElementById('liveCard');if(lc)lc.remove();
  $('btnEn').className='lang-btn';$('btnEn').style.display='';
  $('btnTarget').className='lang-btn';$('btnTarget').style.display='';
  $('btnStop').style.display='none';
  setS(pairLabel(),'');
  animW(false);
  dbg('Stopped');
}

function toggleLang(lang){
  err('');
  if(lang!=='en'&&lang!==targetLang)lang=targetLang;
  if(!ensureApiKey())return;
  if(activeLang===lang)return;
  const primer=new SpeechSynthesisUtterance('');
  primer.volume=0;
  speechSynthesis.speak(primer);
  if(rec){try{rec.abort()}catch(e){}}
  translating=false;pendingText='';clearTimeout(silenceTimer);
  speechSynthesis.cancel();speaking=false;
  const lc=document.getElementById('liveCard');if(lc)lc.remove();

  activeLang=lang;
  $('btnEn').className='lang-btn'+(lang==='en'?' active':'');
  $('btnTarget').className='lang-btn'+(lang===targetLang?' active':'');
  $('btnEn').style.display=lang==='en'?'':'none';
  $('btnTarget').style.display=lang===targetLang?'':'none';
  $('btnStop').style.display='';
  const activeBtn=lang==='en'?$('btnEn'):$('btnTarget');
  activeBtn.style.setProperty('--active-rgb',rgb(lang));
  setS('Listening for '+L[lang].short+'…',lang);
  animW(true,lang);
  startR();
}

let curSize='sm';
function setSize(sz){
  curSize=sz;
  document.body.classList.remove('sz-lg','sz-xl');
  if(sz!=='sm')document.body.classList.add('sz-'+sz);
  $('szSm').className='tbtn'+(sz==='sm'?' on':'');
  $('szLg').className='tbtn'+(sz==='lg'?' on':'');
  $('szXl').className='tbtn'+(sz==='xl'?' on':'');
}

let touchX=0;
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)<80)return;
  if(!activeLang)return;
  const newLang=dx>0?'en':targetLang;
  if(newLang!==activeLang)toggleLang(newLang);
});

speechSynthesis.getVoices();
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

function listVoices(){
  const v=speechSynthesis.getVoices();
  targetIds.concat('en').forEach(id=>{
    const matches=v.filter(x=>(L[id].voiceLangs||[]).some(prefix=>x.lang.toLowerCase().startsWith(prefix.toLowerCase()))).map(x=>x.name+' ('+x.lang+')').join('\n');
    dbg('=== '+L[id].short+' VOICES ===\n'+matches);
  });
}
setTargetLang('es');
setTimeout(listVoices,1000);
</script>
